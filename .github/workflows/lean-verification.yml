name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Lean toolchain manager
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: true
      - name: Prepare verification logs
        run: mkdir -p verification-logs
      - name: Record toolchain versions
        shell: bash
        run: |
          set -o pipefail
          {
            echo '--- lean-toolchain ---'
            cat lean-toolchain
            echo '--- lean --version ---'
            lean --version
            echo '--- lake --version ---'
            lake --version
          } 2>&1 | tee verification-logs/toolchain.log
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -o pipefail
          lake update 2>&1 | tee verification-logs/lake-update.log
      - name: Fetch Mathlib build cache
        shell: bash
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee verification-logs/mathlib-cache.log
      - name: Build project
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee verification-logs/lake-build.log
      - name: Run explicit axiom report
        shell: bash
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee verification-logs/axiom-audit.log
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          lake env lean CollatzLean/Tests.lean 2>&1 | tee verification-logs/tests.log
      - name: Record resolved Mathlib revision
        if: always()
        shell: bash
        run: |
          {
            git -C .lake/packages/mathlib rev-parse HEAD 2>&1 || true
            test ! -f lake-manifest.json || cat lake-manifest.json
          } | tee verification-logs/resolved-dependencies.log
      - name: Upload compiler and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-logs
          path: verification-logs/
          if-no-files-found: warn
